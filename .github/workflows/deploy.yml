name: Build & Deploy to cPanel

on:
  push:
    branches: [deployment]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── Frontend ──
      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: https://baba-menu.umsoftware.id

      # ── Backend ──
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Build backend
        working-directory: ./backend
        run: npm run build

      # ── Create backend .env from secrets ──
      - name: Create backend .env
        working-directory: ./backend
        run: |
          cat <<EOF > .env
          PORT=3000
          DB_PORT=3306
          DB_HOST=localhost
          DB_USER=${{ secrets.DB_USER }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          UPLOAD_DIR=./uploads
          ALLOWED_ORIGINS=https://baba-menu.umsoftware.id
          EOF

      # ── Prepare deploy bundle ──
      - name: Prepare deploy directory
        run: |
          mkdir -p deploy
          cp -r dist/* deploy/
          cp app.js deploy/app.js
          mkdir -p deploy/backend
          cp -r backend/dist deploy/backend/dist
          cp backend/package.json deploy/backend/package.json
          cp backend/package-lock.json deploy/backend/package-lock.json
          cp -r backend/node_modules deploy/backend/node_modules
          cp backend/.env deploy/backend/.env
          mkdir -p deploy/backend/uploads

      # ── Deploy ──
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
